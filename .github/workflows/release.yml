name: Release Verification

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate changelog
        run: go run ./cmd/security-review release changelog validate
      - name: Resolve deterministic release metadata
        run: |
          build_date=$(git show -s --format=%cI "${GITHUB_SHA}" | xargs -I{} date -u -d {} +%Y-%m-%dT%H:%M:%SZ)
          echo "BUILD_DATE=${build_date}" >> "${GITHUB_ENV}"
      - name: Build release matrix
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: ./scripts/build-release.sh
      - name: Generate checksums
        run: ./scripts/checksums.sh
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Generate and validate provenance
        run: |
          go run ./cmd/security-review release provenance generate \
            --directory dist \
            --output dist/provenance.json \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --build-date "${BUILD_DATE}" \
            --builder "github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      # Configure RELEASE_SIGNING_KEY (PKCS#8 PEM) and RELEASE_SIGNING_PUBLIC_KEY
      # (PKIX PEM) as repository or environment secrets used only by tagged releases.
      - name: Sign and verify provenance
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          umask 077
          private_key="${RUNNER_TEMP}/release-signing-key.pem"
          public_key="${RUNNER_TEMP}/release-signing-public-key.pem"
          trap 'rm -f -- "${private_key}" "${public_key}"' EXIT
          printf '%s\n' "${RELEASE_SIGNING_KEY}" > "${private_key}"
          printf '%s\n' "${RELEASE_SIGNING_PUBLIC_KEY}" > "${public_key}"
          go run ./cmd/security-review release provenance sign \
            --provenance dist/provenance.json \
            --private-key "${private_key}" \
            --output dist/provenance.sig
          go run ./cmd/security-review release verify \
            --provenance dist/provenance.json \
            --signature dist/provenance.sig \
            --public-key "${public_key}" \
            --directory dist
